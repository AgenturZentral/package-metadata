name: Export Android 36 Toolchain

on:
  push:
    branches:
      - build/splitkosten-20261004
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Android 36 SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Package toolchain
        run: |
          mkdir -p toolchain/platforms/android-36
          cp -a "$ANDROID_HOME/build-tools/36.0.0" toolchain/build-tools-36.0.0
          cp "$ANDROID_HOME/platforms/android-36/android.jar" toolchain/platforms/android-36/android.jar
          tar -czf android36-toolchain-linux.tar.gz toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: android36-toolchain-linux
          path: android36-toolchain-linux.tar.gz
          retention-days: 1
