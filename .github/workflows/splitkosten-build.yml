name: Build SplitKosten APK

on:
  push:
    branches:
      - build/splitkosten-20261004
    paths:
      - "splitkosten-android/**"
      - ".github/workflows/splitkosten-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "splitkosten-android/**"
      - ".github/workflows/splitkosten-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle -p splitkosten-android :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="splitkosten-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -30
          mkdir -p output
          cp "$APK" output/SplitKosten-v1.0.0.apk
          sha256sum output/SplitKosten-v1.0.0.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitKosten-v1.0.0
          path: output/*
          if-no-files-found: error
          retention-days: 7
