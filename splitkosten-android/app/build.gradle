plugins {
    id "com.android.application"
}

android {
    namespace "de.splitkosten.app"
    compileSdk 36

    defaultConfig {
        applicationId "de.splitkosten.app"
        minSdk 26
        targetSdk 36
        versionCode 100
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
