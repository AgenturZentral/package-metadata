<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>SplitKosten</title>
<style>
:root{--bg:#f5f8fc;--surface:#fff;--text:#082e5c;--muted:#6f8298;--line:#dbe6f1;--blue:#1583f5;--blue2:#0866d8;--navy:#082e5c;--green:#31c866;--orange:#ff9626;--red:#d84d5d;--shadow:0 12px 34px rgba(8,46,92,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:780px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(245,248,252,.94);backdrop-filter:blur(16px);padding:12px 16px}.brand{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}.mark svg{width:40px;height:40px}.word{font-size:21px;font-weight:900;letter-spacing:-.8px}.word b:first-child{color:var(--navy)}.word b:last-child{color:var(--blue)}.claim{font-size:11px;color:var(--muted);margin-top:3px}.content{padding:8px 16px 110px}.hero{background:linear-gradient(135deg,#082e5c,#0b67d4 60%,#1596f5);color:white;border-radius:28px;padding:22px;box-shadow:0 18px 42px rgba(8,77,155,.22);margin:6px 0 18px}.hero h1{margin:0 0 8px;font-size:30px;letter-spacing:-1px}.hero p{margin:0;color:#dbeaff}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800}.primary{background:var(--blue);color:#fff}.white{background:#fff;color:#0b61be}.secondary{background:#edf4fb;color:var(--navy)}.danger{background:#fff0f2;color:var(--red)}.wide{width:100%}.hero .btn{margin-top:16px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.section-title h2{margin:0;font-size:18px}.muted{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px rgba(8,46,92,.05)}.event{border-left:5px solid var(--blue)}.eventtop{display:flex;gap:12px;align-items:center}.emoji{width:48px;height:48px;border-radius:15px;background:#eef6ff;display:grid;place-items:center;font-size:24px}.grow{flex:1;min-width:0}.title{font-size:18px;font-weight:850}.small{font-size:11px}.value{font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f0f5fa;border-radius:12px;padding:9px}.stat small{display:block;color:var(--muted)}.stat b{display:block;margin-top:2px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:7px max(12px,calc((100vw - 780px)/2 + 12px)) calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{border:0;background:none;color:#7a8da0;padding:6px 2px;font-size:11px}.nav button.active{color:var(--blue);font-weight:800}.nav .i{display:block;font-size:21px;margin-bottom:2px}.row{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.avatar,.cat{width:43px;height:43px;border-radius:14px;background:#edf4fb;display:grid;place-items:center;font-weight:850;flex:none}.rowmain{flex:1;min-width:0}.rowmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowmain small{display:block;color:var(--muted);margin-top:3px}.amount{text-align:right;font-weight:900}.good{color:#19894c}.bad{color:#c94150}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px}.textarea{min-height:150px;resize:vertical}.modalback{position:fixed;inset:0;background:rgba(2,14,28,.48);z-index:50;display:flex;align-items:flex-end}.modal{background:#fff;width:100%;max-width:780px;margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:91vh;overflow:auto}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{margin:0}.close{font-size:28px;border:0;background:none}.empty{text-align:center;padding:30px 18px}.empty .big{font-size:42px}.notice{background:#edf6ff;border-radius:13px;padding:11px;color:#28567f}.chips{display:flex;gap:7px;overflow:auto}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.chip.active{background:var(--navy);color:#fff}.fab{position:fixed;right:20px;bottom:94px;width:58px;height:58px;border-radius:20px;border:0;background:var(--blue);color:white;font-size:30px;box-shadow:0 12px 30px rgba(21,131,245,.35)}.back{border:0;background:none;font-size:28px;color:var(--navy);padding:0 6px 0 0}.headrow{display:flex;align-items:center;gap:10px}.settle{border-left:4px solid var(--orange)}.toolbar{display:flex;gap:8px}.toolbar button{flex:1}.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.type{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;text-align:center}.type.active{border-color:var(--blue);background:#eef7ff}.hide{display:none}
</style></head><body><div id="root" class="app"></div><div id="modal"></div>
<script>
const KEY='splitkosten_v1', TYPES={reise:['✈️','Reise'],festival:['🎵','Festival'],wochenende:['🏕️','Wochenende'],verein:['👥','Verein'],wg:['🏠','WG'],sonstiges:['💳','Sonstiges']};
let store=load(),screen='home',tab='overview';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cents=v=>Math.round(Number(String(v).replace(',','.'))*100)||0;
const today=()=>new Date().toISOString().slice(0,10);
function money(c,e=active()){return new Intl.NumberFormat('de-DE',{style:'currency',currency:e?.currency||'EUR'}).format((c||0)/100)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.version===2&&Array.isArray(x.events))return x}catch{}return{version:2,activeEventId:null,events:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function active(){return store.events.find(e=>e.id===store.activeEventId)||null}
function eventObj(x={}){return{id:x.id||id('e'),name:x.name||'Neue Abrechnung',type:x.type||'reise',currency:x.currency||'EUR',people:x.people||[],expenses:x.expenses||[],transfers:x.transfers||[],archived:!!x.archived,createdAt:x.createdAt||new Date().toISOString()}}
function migrateLegacy(o){return{version:2,activeEventId:null,events:[eventObj({name:o?.trip?.name||o?.tripName||'Meine Reise',type:'reise',currency:o?.trip?.currency||o?.currency||'EUR',people:o.people||[],expenses:o.expenses||[],transfers:o.transfers||[]})]}}
function total(e){return e.expenses.reduce((s,x)=>s+(x.amountCents||0),0)}
function calc(e){const paid={},owed={},balance={};e.people.forEach(p=>paid[p.id]=owed[p.id]=balance[p.id]=0);e.expenses.forEach(x=>{if(paid[x.payerId]!=null)paid[x.payerId]+=x.amountCents||0;Object.entries(x.shares||{}).forEach(([pid,v])=>{if(owed[pid]!=null)owed[pid]+=v||0})});e.people.forEach(p=>balance[p.id]=(paid[p.id]||0)-(owed[p.id]||0));(e.transfers||[]).forEach(t=>{if(balance[t.fromId]!=null)balance[t.fromId]+=t.amountCents||0;if(balance[t.toId]!=null)balance[t.toId]-=t.amountCents||0});return{paid,owed,balance}}
function settlements(e){const {balance}=calc(e),d=[],c=[];e.people.forEach(p=>{let b=balance[p.id]||0;if(b<-1)d.push({id:p.id,a:-b});if(b>1)c.push({id:p.id,a:b})});d.sort((a,b)=>b.a-a.a);c.sort((a,b)=>b.a-a.a);let i=0,j=0,out=[];while(i<d.length&&j<c.length){let a=Math.min(d[i].a,c[j].a);out.push({fromId:d[i].id,toId:c[j].id,amountCents:a});d[i].a-=a;c[j].a-=a;if(d[i].a<=1)i++;if(c[j].a<=1)j++}return out}
function person(e,pid){return e.people.find(p=>p.id===pid)}
function mark(){return '<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#fff"/><path fill="#1685F5" d="M120 205 298 110c14-7 29 0 34 14l10 27-200 76Z"/><path fill="#31C866" stroke="#fff" stroke-width="8" d="m147 219 165-70c14-6 28 2 32 16l10 30-190 43Z"/><path fill="#FF9626" stroke="#fff" stroke-width="8" d="m291 165 76 22c13 4 20 17 16 29l-10 31-65-18Z"/><rect x="92" y="217" width="325" height="207" rx="32" fill="#0B3A75"/><rect x="108" y="234" width="294" height="173" rx="24" fill="#0D4B91"/><rect x="305" y="275" width="132" height="86" rx="24" fill="#0B3A75" stroke="#fff" stroke-width="10"/><circle cx="392" cy="318" r="12" fill="#fff"/></svg>'}
function brand(inner=''){return '<div class="top"><div class="brand">'+(inner||'<div class="mark">'+mark()+'</div><div><div class="word"><b>Split</b><b>Kosten</b></div><div class="claim">Gemeinsam zahlen. Fair teilen.</div></div>')+'</div></div>'}
function render(){let r=$('#root');if(screen==='home'||!active()){screen='home';r.innerHTML=home();return}let e=active();r.innerHTML=brand('<button class="back" onclick="goHome()">‹</button><div class="grow"><div class="title">'+esc(e.name)+'</div><div class="small muted">'+TYPES[e.type][1]+' · '+e.people.length+' Personen</div></div>')+'<main class="content">'+(tab==='overview'?overview(e):tab==='expenses'?expenses(e):tab==='people'?people(e):tab==='settle'?settle(e):more(e))+'</main>'+nav()+((tab==='overview'||tab==='expenses')?'<button class="fab" onclick="openExpense()">＋</button>':'');}
function home(){let live=store.events.filter(e=>!e.archived);return brand()+'<main class="content"><section class="hero"><h1>Wer hat was bezahlt?</h1><p>Urlaub, Festival, WG oder Vereinsfahrt – SplitKosten rechnet fair aus, wer wem noch etwas schuldet.</p><button class="btn white" onclick="openNewEvent()">＋ Neue Abrechnung</button></section><div class="section-title"><h2>Deine Abrechnungen</h2><span class="muted">'+live.length+' aktiv</span></div>'+(live.length?live.map(eventCard).join(''):'<div class="card empty"><div class="big">💳</div><h3>Noch keine Abrechnung</h3><p class="muted">Lege eine neue Abrechnung an oder übernimm deine bestehende Urlaubskasse.</p><button class="btn primary wide" onclick="openNewEvent()">Neue Abrechnung</button><button class="btn secondary wide" style="margin-top:9px" onclick="openImport()">Urlaubskasse übernehmen</button></div>')+'</main>'}
function eventCard(e){return '<div class="card event" onclick="openEvent(\''+e.id+'\')"><div class="eventtop"><div class="emoji">'+TYPES[e.type][0]+'</div><div class="grow"><div class="title">'+esc(e.name)+'</div><div class="small muted">'+TYPES[e.type][1]+' · '+e.people.length+' Personen</div></div><div class="value">'+money(total(e),e)+'</div></div><div class="stats"><div class="stat"><small>Ausgaben</small><b>'+e.expenses.length+'</b></div><div class="stat"><small>Personen</small><b>'+e.people.length+'</b></div><div class="stat"><small>Offen</small><b>'+settlements(e).length+'</b></div></div></div>'}
function overview(e){let c=calc(e),recent=[...e.expenses].slice(-4).reverse();return '<section class="hero"><div class="small">Bisher ausgegeben</div><h1>'+money(total(e),e)+'</h1><p>'+e.expenses.length+' Ausgaben · '+e.people.length+' Personen</p></section><div class="toolbar"><button class="btn secondary" onclick="openExpense()">＋ Ausgabe</button><button class="btn secondary" onclick="tab=\'settle\';render()">⇄ Abrechnen</button></div><div class="section-title"><h2>Salden</h2></div><div class="card">'+(e.people.length?e.people.map(p=>'<div class="row"><div class="avatar">'+esc(p.name.slice(0,2).toUpperCase())+'</div><div class="rowmain"><b>'+esc(p.name)+'</b><small>bezahlt '+money(c.paid[p.id],e)+'</small></div><div class="amount '+(c.balance[p.id]>=0?'good':'bad')+'">'+(c.balance[p.id]>=0?'+':'')+money(c.balance[p.id],e)+'</div></div>').join(''):'<div class="empty muted">Noch keine Personen.</div>')+'</div><div class="section-title"><h2>Zuletzt</h2></div><div class="card">'+(recent.length?recent.map(x=>expenseRow(e,x)).join(''):'<div class="empty muted">Noch keine Ausgaben.</div>')+'</div>'}
function expenseRow(e,x){return '<div class="row" onclick="openExpense(\''+x.id+'\')"><div class="cat">'+(x.category||'💶')+'</div><div class="rowmain"><b>'+esc(x.title)+'</b><small>'+esc(person(e,x.payerId)?.name||'')+' · '+esc(x.date||'')+'</small></div><div class="amount">'+money(x.amountCents,e)+'</div></div>'}
function expenses(e){return '<h1>Ausgaben</h1><div class="card">'+(e.expenses.length?[...e.expenses].reverse().map(x=>expenseRow(e,x)).join(''):'<div class="empty muted">Noch keine Ausgaben.</div>')+'</div>'}
function people(e){let c=calc(e);return '<div class="section-title"><h2>Personen</h2><button class="btn secondary" onclick="openPerson()">＋ Person</button></div><div class="card">'+(e.people.length?e.people.map(p=>'<div class="row"><div class="avatar">'+esc(p.name.slice(0,2).toUpperCase())+'</div><div class="rowmain"><b>'+esc(p.name)+'</b><small>Anteil '+money(c.owed[p.id],e)+'</small></div><button class="btn secondary" onclick="event.stopPropagation();openPerson(\''+p.id+'\')">Ändern</button></div>').join(''):'<div class="empty muted">Noch keine Personen.</div>')+'</div>'}
function settle(e){let s=settlements(e);return '<h1>Abrechnung</h1><div class="card">'+(s.length?s.map(x=>'<div class="row settle"><div class="rowmain"><b>'+esc(person(e,x.fromId)?.name)+' → '+esc(person(e,x.toId)?.name)+'</b><small>Ausgleichszahlung</small></div><div class="amount">'+money(x.amountCents,e)+'</div></div>').join(''):'<div class="empty"><div class="big">✓</div><b>Alles ausgeglichen</b></div>')+'</div>'}
function more(e){return '<h1>Mehr</h1><div class="card"><button class="btn secondary wide" onclick="openImport()">Urlaubskasse / Backup importieren</button><button class="btn secondary wide" style="margin-top:9px" onclick="backup()">Backup kopieren</button><button class="btn secondary wide" style="margin-top:9px" onclick="openEditEvent()">Abrechnung bearbeiten</button><button class="btn danger wide" style="margin-top:9px" onclick="deleteEvent()">Abrechnung löschen</button></div><div class="card"><b>SplitKosten 1.0.0</b><div class="small muted">Offline · keine Anmeldung · keine Internet-Berechtigung</div></div>'}
function nav(){return '<nav class="nav">'+[['overview','⌂','Übersicht'],['expenses','≡','Ausgaben'],['people','👥','Personen'],['settle','⇄','Abrechnung'],['more','•••','Mehr']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="tab=\''+x[0]+'\';render()"><span class="i">'+x[1]+'</span>'+x[2]+'</button>').join('')+'</nav>'}
function openEvent(id){store.activeEventId=id;save();screen='event';tab='overview';render()}function goHome(){screen='home';store.activeEventId=null;save();render()}
function modal(html){$('#modal').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}function closeModal(){$('#modal').innerHTML=''}
function openNewEvent(){modal('<div class="modalhead"><h2>Neue Abrechnung</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="en" class="input" placeholder="z. B. Hamburg 2026"></div><div class="field"><label>Typ</label><select id="et" class="select">'+Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'">'+v[0]+' '+v[1]+'</option>').join('')+'</select></div><div class="field"><label>Währung</label><select id="ec" class="select"><option>EUR</option><option>CHF</option><option>USD</option><option>GBP</option></select></div><button class="btn primary wide" onclick="createEvent()">Anlegen</button>')}
function createEvent(){let e=eventObj({name:$('#en').value.trim()||'Neue Abrechnung',type:$('#et').value,currency:$('#ec').value});store.events.push(e);store.activeEventId=e.id;save();closeModal();screen='event';tab='people';render()}
function openEditEvent(){let e=active();modal('<div class="modalhead"><h2>Abrechnung bearbeiten</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="een" class="input" value="'+esc(e.name)+'"></div><div class="field"><label>Währung</label><select id="eec" class="select"><option '+(e.currency==='EUR'?'selected':'')+'>EUR</option><option '+(e.currency==='CHF'?'selected':'')+'>CHF</option><option '+(e.currency==='USD'?'selected':'')+'>USD</option><option '+(e.currency==='GBP'?'selected':'')+'>GBP</option></select></div><button class="btn primary wide" onclick="saveEventEdit()">Speichern</button>')}
function saveEventEdit(){let e=active();e.name=$('#een').value.trim()||e.name;e.currency=$('#eec').value;save();closeModal();render()}
function deleteEvent(){if(!confirm('Abrechnung wirklich löschen?'))return;let id=active().id;store.events=store.events.filter(e=>e.id!==id);store.activeEventId=null;save();screen='home';render()}
function openPerson(pid){let e=active(),p=pid?person(e,pid):null;modal('<div class="modalhead"><h2>'+(p?'Person bearbeiten':'Person hinzufügen')+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="pn" class="input" value="'+esc(p?.name||'')+'"></div><button class="btn primary wide" onclick="savePerson(\''+(pid||'')+'\')">Speichern</button>')}
function savePerson(pid){let e=active(),n=$('#pn').value.trim();if(!n)return;if(pid)person(e,pid).name=n;else e.people.push({id:id('p'),name:n});save();closeModal();render()}
function splitEqual(amount,ids){let base=Math.floor(amount/ids.length),rem=amount-base*ids.length,o={};ids.forEach((x,i)=>o[x]=base+(i<rem?1:0));return o}
function openExpense(xid){let e=active();if(!e.people.length){alert('Bitte zuerst Personen anlegen.');tab='people';render();return}let x=xid?e.expenses.find(x=>x.id===xid):null;modal('<div class="modalhead"><h2>'+(x?'Ausgabe bearbeiten':'Neue Ausgabe')+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Beschreibung</label><input id="xt" class="input" value="'+esc(x?.title||'')+'"></div><div class="grid2"><div class="field"><label>Betrag</label><input id="xa" class="input" inputmode="decimal" value="'+(x?(x.amountCents/100).toFixed(2):'')+'"></div><div class="field"><label>Datum</label><input id="xd" type="date" class="input" value="'+esc(x?.date||today())+'"></div></div><div class="field"><label>Bezahlt von</label><select id="xp" class="select">'+e.people.map(p=>'<option value="'+p.id+'" '+(x?.payerId===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Aufteilen auf</label>'+e.people.map(p=>'<label style="display:block;margin:7px 0"><input class="part" type="checkbox" value="'+p.id+'" '+(!x||x.shares?.[p.id]!=null?'checked':'')+'> '+esc(p.name)+'</label>').join('')+'</div><button class="btn primary wide" onclick="saveExpense(\''+(xid||'')+'\')">Speichern</button>')}
function saveExpense(xid){let e=active(),title=$('#xt').value.trim(),amount=cents($('#xa').value),parts=[...document.querySelectorAll('.part:checked')].map(x=>x.value);if(!title||amount<=0||!parts.length)return alert('Bitte alle Pflichtfelder ausfüllen.');let data={id:xid||id('x'),title,amountCents:amount,date:$('#xd').value,payerId:$('#xp').value,shares:splitEqual(amount,parts),category:'💶',createdAt:new Date().toISOString()};if(xid)e.expenses[e.expenses.findIndex(x=>x.id===xid)]=data;else e.expenses.push(data);save();closeModal();render()}
function backup(){let t=JSON.stringify(store,null,2);if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('Backup in Zwischenablage kopiert.')).catch(()=>showBackup(t))}else showBackup(t)}
function showBackup(t){modal('<div class="modalhead"><h2>Backup</h2><button class="close" onclick="closeModal()">×</button></div><textarea class="textarea" style="min-height:300px">'+esc(t)+'</textarea>')}
function openImport(){modal('<div class="modalhead"><h2>Urlaubskasse übernehmen</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>Importiert SplitKosten-Backups und alte Urlaubskasse-Sicherungen.</b><br>JSON-Datei auswählen oder kopierte Sicherung einfügen.</div><div class="field"><label>JSON-Datei</label><input id="imfile" class="input" type="file" accept=".json,application/json" onchange="readFile(this)"></div><div class="field"><label>Oder JSON einfügen</label><textarea id="im" class="textarea" placeholder="Sicherung hier einfügen"></textarea></div><button class="btn primary wide" onclick="doImport()">Daten übernehmen</button>')}
function readFile(i){let f=i.files&&i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>$('#im').value=String(r.result||'');r.readAsText(f)}
function doImport(){try{let o=JSON.parse($('#im').value.trim()),n;if(o.version===2&&Array.isArray(o.events))n=o;else if(Array.isArray(o.people)&&Array.isArray(o.expenses))n=migrateLegacy(o);else throw 0;if(!confirm('Aktuelle SplitKosten-Daten durch diese Sicherung ersetzen?'))return;store=n;if(!store.activeEventId&&store.events.length)store.activeEventId=store.events[0].id;save();closeModal();screen='home';store.activeEventId=null;render();alert('Import erfolgreich.')}catch{alert('Die Sicherung ist ungültig.')}}
render();
</script></body></html>
